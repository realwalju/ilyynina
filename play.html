<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play | Nina</title>
  <meta name="description" content="A future game for Nina's community. In the works.">
  <meta name="theme-color" content="#0a0b0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="play">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" data-header></header>
  <main id="main">
    <section class="page-head" data-emote-sprinkles="Bonk Froggy">
      <div class="wrap">
        <span class="kicker" data-kicker-emote="Bonk">Play</span>
        <h1><span class="chrome">Play</span></h1>
        <p>A little space for something fun.</p>
      </div>
    </section>
    <section class="section" data-emote-sprinkles="Coffee Cozy1 Wave" aria-labelledby="play-status">
      <div class="wrap">
        <div class="play-placeholder">
          <div class="play-emotes" aria-hidden="true">
            <img data-emote-img="Coffee" data-emote-static width="112" height="112" alt="" decoding="async">
            <img data-emote-img="Bonk" data-emote-static width="112" height="112" alt="" decoding="async">
            <img data-emote-img="Froggy" data-emote-static width="112" height="112" alt="" decoding="async">
          </div>
          <span class="kicker">Work in progress</span>
          <h2 id="play-status">In the works</h2>
          <p>This is the spot for a future game. The idea is still taking shape.</p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="watch.html">Watch Nina</a>
            <a class="btn btn-ghost" href="emotes.html">Explore the emotes</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" data-footer></footer>
  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
</body>
</html>

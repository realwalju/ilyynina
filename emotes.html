<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Prototype for a pitch, not launched: keep out of search. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Emotes | Nina</title>
  <meta name="description" content="Every ilyyni sub emote from Nina's Twitch channel.">
  <meta name="theme-color" content="#0a0b0c">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="emotes">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" data-header></header>

  <main id="main">
    <section class="page-head" data-emote-sprinkles="Wave Love">
      <div class="wrap">
        <span class="kicker" data-kicker-emote="Froggy">Emotes</span>
        <h1><span class="chrome">The Emotes</span></h1>
        <p>Every sub emote on the channel. Click one to copy its name for chat.</p>
      </div>
    </section>

    <section class="section" data-emote-sprinkles="Froggy Dance Howdy">
      <div class="wrap">
        <p class="copy-toast" role="status" data-emote-status></p>
        <div class="emote-tools">
          <label for="emote-search">Find an emote
            <input id="emote-search" type="search" placeholder="Name or chat token" autocomplete="off" aria-controls="emote-list">
          </label>
          <p role="status" data-emote-count></p>
        </div>
        <ul class="emote-grid" id="emote-list" data-emote-grid></ul>
      </div>
    </section>

  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>

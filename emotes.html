<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Prototype for a pitch, not launched: keep out of search. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Emotes | Nina</title>

  <meta name="theme-color" content="#0a0b0c">

  <link rel="preconnect" href="https://fonts.googleapis.com">

    <section class="section" data-emote-sprinkles="Froggy Dance Howdy">
      <div class="wrap">
        <p class="copy-toast" role="status" data-emote-status></p>
        <ul class="emote-grid" data-emote-grid></ul>
      </div>
    </section>

  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
